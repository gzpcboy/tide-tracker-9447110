  <main class="app">

      <h1><span aria-hidden="true">🌊</span> West Seattle Area Tides</h1>
      <div class="station" id="stationName">Station 9447110</div>

    <div class="date-bar">

  <script>
    const STATION_ID = "9447110";
    const CURVE_STATION_ID = "9447130"; // Seattle reference station, provides full-interval predictions.
    const CURVE_TIME_OFFSET_MINUTES = -1; // Measured against Station 9447110 over 90 days.
    const API_BASE = "https://api.tidesandcurrents.noaa.gov/api/prod/datagetter";
    const MD_API = "https://api.tidesandcurrents.noaa.gov/mdapi/prod/webapi/stations/" + STATION_ID + ".json";

    // Seattle day-of-year average sunset times, local clock, minutes after midnight.
    // One value is stored for every calendar day, including February 29.
    const SEA_SUNSET_MINUTES = [987, 988, 989, 990, 991, 992, 993, 994, 995, 996, 998, 999, 1000, 1001, 1003, 1004, 1006, 1007, 1008, 1010, 1011, 1013, 1014, 1016, 1017, 1019, 1020, 1022, 1023, 1025, 1026, 1028, 1030, 1031, 1033, 1034, 1036, 1038, 1039, 1041, 1042, 1044, 1046, 1047, 1049, 1050, 1052, 1054, 1055, 1057, 1058, 1060, 1062, 1063, 1065, 1066, 1068, 1069, 1071, 1072, 1074, 1075, 1077, 1078, 1080, 1081, 1083, 1144, 1146, 1147, 1149, 1150, 1152, 1153, 1155, 1156, 1158, 1159, 1160, 1162, 1163, 1165, 1166, 1168, 1169, 1170, 1172, 1173, 1175, 1176, 1177, 1179, 1180, 1182, 1183, 1184, 1186, 1187, 1188, 1190, 1191, 1193, 1194, 1195, 1197, 1198, 1200, 1201, 1202, 1204, 1205, 1207, 1208, 1209, 1211, 1212, 1214, 1215, 1216, 1218, 1219, 1220, 1222, 1223, 1225, 1226, 1227, 1229, 1230, 1231, 1233, 1234, 1235, 1237, 1238, 1239, 1241, 1242, 1243, 1244, 1245, 1247, 1248, 1249, 1250, 1251, 1252, 1253, 1254, 1256, 1257, 1258, 1258, 1259, 1260, 1261, 1262, 1263, 1264, 1264, 1265, 1266, 1266, 1267, 1267, 1268, 1268, 1269, 1269, 1270, 1270, 1270, 1271, 1271, 1271, 1271, 1271, 1271, 1271, 1271, 1271, 1271, 1271, 1270, 1270, 1270, 1269, 1269, 1269, 1268, 1268, 1267, 1266, 1266, 1265, 1264, 1263, 1263, 1262, 1261, 1260, 1259, 1258, 1257, 1256, 1255, 1254, 1252, 1251, 1250, 1249, 1247, 1246, 1245, 1243, 1242, 1240, 1239, 1237, 1236, 1234, 1233, 1231, 1229, 1228, 1226, 1224, 1223, 1221, 1219, 1217, 1216, 1214, 1212, 1210, 1208, 1206, 1204, 1203, 1201, 1199, 1197, 1195, 1193, 1191, 1189, 1187, 1185, 1183, 1181, 1179, 1177, 1175, 1173, 1171, 1168, 1166, 1164, 1162, 1160, 1158, 1156, 1154, 1152, 1150, 1148, 1146, 1144, 1142, 1139, 1137, 1135, 1133, 1131, 1129, 1127, 1125, 1123, 1121, 1119, 1117, 1115, 1113, 1111, 1109, 1107, 1105, 1104, 1102, 1100, 1098, 1096, 1094, 1092, 1091, 1089, 1087, 1085, 1084, 1082, 1080, 1079, 1077, 1075, 1074, 1072, 1011, 1009, 1008, 1006, 1005, 1004, 1002, 1001, 1000, 998, 997, 996, 995, 994, 993, 991, 990, 989, 989, 988, 987, 986, 985, 984, 984, 983, 982, 982, 981, 981, 980, 980, 979, 979, 979, 979, 978, 978, 978, 978, 978, 978, 978, 978, 979, 979, 979, 980, 980, 980, 981, 981, 982, 983, 983, 984, 985, 985, 986, 987];

    const datePicker = document.getElementById("datePicker");
    const prevBtn = document.getElementById("prevDay");
    const nextBtn = document.getElementById("nextDay");
    const todayPill = document.getElementById("todayPill");
    const weekdayLabel = document.getElementById("weekdayLabel");
    const todayLink = document.getElementById("todayLink");
    const content = document.getElementById("content");
    const stationNameEl = document.getElementById("stationName");

    function pad(n) { return String(n).padStart(2, "0"); }
    function toYMD(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
    function ymdCompact(s) { return s.replace(/-/g, ""); }
    function todayYMD() { return toYMD(new Date()); }

    function parseApiTime(t) {
      const [datePart, timePart] = t.split(" ");
      const [y, mo, d] = datePart.split("-").map(Number);
      const [h, mi] = timePart.split(":").map(Number);
      return new Date(y, mo - 1, d, h, mi);
    }

    function formatTime(date) {
      return pad(date.getHours()) + ":" + pad(date.getMinutes());
    }

    function formatHeight(v) {
      const n = parseFloat(v);
      return n.toFixed(1) + " ft";
    }

    function formatWeekday(ymd) {
      const d = parseApiTime(ymd + " 12:00");
      return d.toLocaleDateString(undefined, { weekday: "long" });
    }

    function formatLongDate(ymd) {
      const d = parseApiTime(ymd + " 12:00");
      return d.toLocaleDateString(undefined, {
        weekday: "long", month: "long", day: "numeric", year: "numeric",
      });
    }

    function formatAsOf(date) {
      return formatTime(date);
    }

    function relativeFromNow(date) {
      const diffMs = date - new Date();
      const mins = Math.round(diffMs / 60000);
      if (mins <= 0) return "now";
      const h = Math.floor(mins / 60);
      const m = mins % 60;
      if (h === 0) return "in " + m + " min";
      if (m === 0) return "in " + h + " hr";
      return "in " + h + " hr " + m + " min";
    }

    function clamp(value, min, max) {
      return Math.min(max, Math.max(min, value));
    }

    function estimateCurrentTide(tides, now) {
      let prev = null;
      let next = null;

      for (const tide of tides) {
        if (tide.date <= now) prev = tide;
        if (!next && tide.date > now) next = tide;
      }

      if (!prev || !next) return null;

      const totalMs = next.date - prev.date;
      if (totalMs <= 0) return null;

      const progress = clamp((now - prev.date) / totalMs, 0, 1);
      const start = parseFloat(prev.height);
      const end = parseFloat(next.height);
      const swing = (1 - Math.cos(Math.PI * progress)) / 2;
      const height = start + (end - start) * swing;
      const trend = end > start ? "Rising" : "Falling";
      const nextLabel = next.type === "H" ? "high" : "low";

      return {
        prev,
        next,
        trend,
        height,
        progress,
        summary: trend + " toward " + nextLabel + " tide",
      };
    }

    function setStatus(msg, isError) {
      content.innerHTML = '<div class="status' + (isError ? ' error' : '') +
        '" id="statusMsg">' + msg + "</div>";
    }

    async function fetchStationName() {
      try {
        const res = await fetch(MD_API);
        if (!res.ok) return;
        const data = await res.json();
        const s = data.stations && data.stations[0];
        if (s && s.name) {
          stationNameEl.textContent = s.name +
            (s.state ? ', ' + s.state : '') + ' · Station ' + STATION_ID;
        }
      } catch (e) { }
    }

    async function fetchTides(ymd, includeContext = false) {
      const selectedDay = parseApiTime(ymd + ' 12:00');
      const previousDay = new Date(selectedDay);
      const nextDay = new Date(selectedDay);
      if (includeContext) {
        previousDay.setDate(previousDay.getDate() - 1);
        nextDay.setDate(nextDay.getDate() + 1);
      }
      const url = API_BASE +
        '?product=predictions&application=tide-tracker&datum=MLLW&station=' + STATION_ID +
        '&time_zone=lst_ldt&units=english&interval=hilo&format=json' +
        '&begin_date=' + ymdCompact(toYMD(previousDay)) + '&end_date=' + ymdCompact(toYMD(nextDay));
      const res = await fetch(url);
      if (!res.ok) throw new Error('NOAA API returned ' + res.status);
      const data = await res.json();
      if (data.error) throw new Error(data.error.message || 'API error');
      return (data.predictions || []).map(p => ({
        date: parseApiTime(p.t),
        height: p.v,
        type: p.type,
      }));
    }

    function renderTodayView(tides, contextTides, hourlyHeights) {
      const now = new Date();
      // Context includes tomorrow, so late-evening cards remain useful.
      const nextHigh = contextTides.find(t => t.type === 'H' && t.date > now);
      const nextLow = contextTides.find(t => t.type === 'L' && t.date > now);
      const current = estimateCurrentTide(hourlyHeights, now);

      function cardHtml(kind, label, tide) {
        if (!tide) {
          return '<div class="card ' + kind + '" data-kind="' + kind + '" data-state="none">' +
            '<div class="label"><span class="dot"></span>' + label + '</div>' +
            '<div class="none">–</div>' +
            '<div class="height">No more ' + kind + ' tide today</div></div>';
        }
        const f = formatTime(tide.date);
        return '<div class="card ' + kind + '" data-kind="' + kind + '" data-state="value">' +
          '<div class="label"><span class="dot"></span>' + label +
            (toYMD(tide.date) === todayYMD() ? '' : ' · Tomorrow') + '</div>' +
          '<div class="time">' + f + '</div>' +
          '<div class="height">' + formatHeight(tide.height) + '</div>' +
          '<div class="rel">' + relativeFromNow(tide.date) + '</div></div>';
      }

      const currentHtml = current
        ? '<section class="card hero-card" id="currentTideCard" data-state="value">' +
          '<div class="eyebrow">Current tide</div>' +
          '<div class="current-line">' +
            '<div class="trend">' + current.trend + '</div>' +
          '</div>' +
          '<div class="summary">' + current.summary + '</div>' +
          '<div class="meta">' +
            '<span>As of ' + formatAsOf(now) + '</span>' +
            '<span>Next turn ' + relativeFromNow(current.next.date) + '</span>' +
          '</div>' +
          '<div class="progress" aria-hidden="true"><span style="width:' + Math.round(current.progress * 100) + '%"></span></div>' +
        '</section>'
        : '<section class="card hero-card" id="currentTideCard" data-state="none">' +
          '<div class="eyebrow">Current tide</div>' +
          '<div class="current-line"><div class="current-height">No current estimate</div></div>' +
          '<div class="summary">Current tide estimate becomes available once we have both the previous and next tide turn.</div>' +
          '<div class="meta"><span>As of ' + formatAsOf(now) + '</span></div>' +
        '</section>';

      let referenceRows = '';
      for (const t of tides) {
        const f = formatTime(t.date);
        const kind = t.type === 'H' ? 'high' : 'low';
        const word = t.type === 'H' ? 'High' : 'Low';
        const isPast = t.date <= now;
        referenceRows += '<div class="tide-row' + (isPast ? ' past' : '') + '" data-kind="' + kind + '">' +
          '<span class="badge ' + kind + '">' + word + '</span>' +
          '<span class="r-time">' + f + '</span>' +
          '<span class="r-height">' + formatHeight(t.height) + '</span>' +
          (isPast ? '<span class="r-status">Passed</span>' : '') +
        '</div>';
      }

      content.innerHTML = renderTideChart(tides, now, current, contextTides, hourlyHeights) + '<div class="cards">' +
        cardHtml('low', 'Next Low Tide', nextLow) +
        cardHtml('high', 'Next High Tide', nextHigh) +
        '</div>' +
        '<details class="full-list today-reference" aria-label="Today’s tide reference"><summary>Today’s tide reference</summary>' +
        referenceRows + '</details>';
    }

    function renderTideChart(tides, now, current, contextTides, hourlyHeights) {
      if (!hourlyHeights.length) return '';
      // Separate annotation lanes keep current, high and low labels apart.
      const width = 400, height = 352, left = 24, right = 24, top = 126, bottom = 244;
      const dayStart = parseApiTime(toYMD(now) + ' 00:00');
      const dayEnd = new Date(dayStart); dayEnd.setDate(dayEnd.getDate() + 1);
      const samples = [...hourlyHeights, ...tides].sort((a,b) => a.date-b.date);
      const relevant = samples.filter(t => t.date >= dayStart-3600000 && t.date <= +dayEnd+3600000);
      if (relevant.length < 2) return '';
      const values = relevant.map(t => +t.height);
      const min = Math.min(...values), max = Math.max(...values);
      const span = Math.max(1, max-min);
      const x = date => left + (date-dayStart)/(dayEnd-dayStart)*(width-left-right);
      const y = value => bottom - (value-min)/span*(bottom-top);
      const path = relevant.map((t,i) => (i ? 'L ' : 'M ') + x(t.date).toFixed(2)+' '+y(+t.height).toFixed(2)).join(' ');
      const ticks = [0,6,12,18,24].map(h => {
        const tx = left+h/24*(width-left-right);
        return '<line class="grid-line" x1="'+tx+'" x2="'+tx+'" y1="'+top+'" y2="'+bottom+'"/><text class="axis-label" x="'+tx+'" y="344" text-anchor="middle">'+pad(h)+':00</text>';
      }).join('');
      function labels(type, laneY) {
        const events = tides.filter(t=>t.type===type);
        const labelWidth = 82, gap = 4;
        const centers = events.map(t=>clamp(x(t.date), labelWidth/2+4, width-labelWidth/2-4));
        for(let i=1;i<centers.length;i++) centers[i]=Math.max(centers[i],centers[i-1]+labelWidth+gap);
        if(centers.length && centers.at(-1)>width-labelWidth/2-4) {
          centers[centers.length-1]=width-labelWidth/2-4;
          for(let i=centers.length-2;i>=0;i--) centers[i]=Math.min(centers[i],centers[i+1]-labelWidth-gap);
        }
        const low=type==='L', color=low?'#fbbf24':'#a8c6dd';
        return events.map((t,i)=>{
          const cx=centers[i], px=x(t.date), py=y(+t.height);
          return '<g class="event-label" data-kind="'+(low?'low':'high')+'">'+
            '<path d="M '+px+' '+py+' L '+cx+' '+(low?laneY:laneY+57)+'" fill="none" stroke="'+color+'" stroke-opacity=".6"/>'+
            '<circle cx="'+px+'" cy="'+py+'" r="'+(low?5:4)+'" fill="'+color+'" stroke="#09243a" stroke-width="2"/>'+
            '<rect x="'+(cx-41)+'" y="'+laneY+'" width="82" height="57" rx="8" fill="'+(low?'#3b321b':'#102c40')+'"/>'+
            '<text x="'+cx+'" y="'+(laneY+13)+'" text-anchor="middle" fill="'+color+'" font-size="11">'+(low?'LOW TIDE':'HIGH TIDE')+'</text>'+
            '<text x="'+cx+'" y="'+(laneY+32)+'" text-anchor="middle" fill="#eaf6ff" font-size="17" font-weight="700">'+formatTime(t.date)+'</text>'+
            '<text x="'+cx+'" y="'+(laneY+50)+'" text-anchor="middle" fill="'+color+'" font-size="17" font-weight="750">'+formatHeight(t.height)+'</text></g>';
        }).join('');
      }
      // Interpolate the very same plotted segments so the dot is on the curve.
      const prev = samples.filter(t=>t.date<=now).at(-1);
      const next = samples.find(t=>t.date>now);
      let marker='';
      if(prev && next) {
        const value=+prev.height+(+next.height-+prev.height)*(now-prev.date)/(next.date-prev.date);
        const px=x(now), py=y(value), labelX=clamp(px,66,width-66);
        marker='<g class="now-marker"><path class="now-line" fill="none" d="M '+labelX+' 49 L '+px+' '+(top-8)+' L '+px+' '+py+'"/>'+
          '<rect class="now-backplate" x="'+(labelX-62)+'" y="1" width="124" height="49" rx="9"/>'+
          '<text class="now-label" x="'+labelX+'" y="18" text-anchor="middle">Now · '+formatTime(now)+'</text>'+
          '<text class="now-value" x="'+labelX+'" y="41" text-anchor="middle">'+value.toFixed(1)+' ft</text>'+
          '<circle class="now-dot" cx="'+px+'" cy="'+py+'" r="6"/></g>';
      }
      return '<section class="tide-chart" id="todayTideChart" aria-label="Today’s tide curve">'+
        '<svg viewBox="0 0 400 352" role="img" aria-label="Tide predictions, current time, and all high and low tides">'+
        '<defs><clipPath id="tidePlotClip"><rect x="'+left+'" y="'+(top-8)+'" width="'+(width-left-right)+'" height="'+(bottom-top+16)+'"/></clipPath></defs>'+
        ticks+'<path class="curve" clip-path="url(#tidePlotClip)" d="'+path+'"/>'+labels('H',62)+labels('L',266)+marker+'</svg></section>';
    }

    async function fetchHourlyHeights(ymd) {
      const selectedDay = parseApiTime(ymd + ' 12:00');
      const previousDay = new Date(selectedDay);
      const nextDay = new Date(selectedDay);
      previousDay.setDate(previousDay.getDate() - 1);
      nextDay.setDate(nextDay.getDate() + 1);
      const url = API_BASE +
        '?product=predictions&application=west-seattle-area-tides&datum=MLLW&station=' + CURVE_STATION_ID +
        '&time_zone=lst_ldt&units=english&interval=h&format=json' +
        '&begin_date=' + ymdCompact(toYMD(previousDay)) + '&end_date=' + ymdCompact(toYMD(nextDay));
      const res = await fetch(url);
      if (!res.ok) throw new Error('NOAA API returned ' + res.status);
      const data = await res.json();
      if (data.error) throw new Error(data.error.message || 'API error');
      return (data.predictions || []).map(p => ({
        date: new Date(parseApiTime(p.t).getTime() + CURVE_TIME_OFFSET_MINUTES * 60000),
        height: p.v,
      }));
    }

    function dayOfYearIndex(ymd) {
      const d = parseApiTime(ymd + " 12:00");
      const start = new Date(d.getFullYear(), 0, 1, 12);
      let index = Math.floor((d - start) / 86400000);
      const leap = d.getFullYear() % 4 === 0 && (d.getFullYear() % 100 !== 0 || d.getFullYear() % 400 === 0);
      if (!leap && d.getMonth() > 1) index += 1;
      return index;
    }

    function sunsetMinutesFor(ymd) {
      return SEA_SUNSET_MINUTES[dayOfYearIndex(ymd)];
    }

    function dateAtMinute(ymd, minute) {
      const d = parseApiTime(ymd + " 00:00");
      d.setMinutes(minute);
      return d;
    }

    function formatMinute(minute) {
      return pad(Math.floor(minute / 60)) + ":" + pad(minute % 60);
    }

    function simulatedTidePoints(tides, ymd) {
      if (tides.length < 2) return tides;
      const nodes = tides.map(t => ({ date: t.date, height: +t.height }));
      const first = nodes[0], second = nodes[1];
      const penultimate = nodes.at(-2), last = nodes.at(-1);
      const firstGap = second.date - first.date;
      const lastGap = last.date - penultimate.date;
      // Extend the first/last half-wave using numeric timestamps, never Date + number.
      nodes.unshift({ date: new Date(first.date.getTime() - firstGap), height: second.height });
      nodes.push({ date: new Date(last.date.getTime() + lastGap), height: penultimate.height });

      function heightAt(date) {
        let i = 0;
        while (i < nodes.length - 2 && date > nodes[i + 1].date) i++;
        const a = nodes[i], b = nodes[i + 1];
        const p = clamp((date - a.date) / (b.date - a.date), 0, 1);
        return a.height + (b.height - a.height) * (1 - Math.cos(Math.PI * p)) / 2;
      }

      const samples = [];
      for (let minute = 0; minute <= 1440; minute += 12) {
        const date = dateAtMinute(ymd, minute);
        samples.push({ date, height: heightAt(date) });
      }
      for (const tide of tides) samples.push({ date: tide.date, height: +tide.height });
      return samples.sort((a, b) => a.date - b.date);
    }

    function renderForecastChart(tides, ymd, sunsetMinute) {
      const width = 400, height = 346, left = 24, right = 24, top = 66, bottom = 235;
      const dayStart = dateAtMinute(ymd, 0);
      const dayEnd = dateAtMinute(ymd, 1440);
      const samples = simulatedTidePoints(tides, ymd);
      const raw = samples.map(t => +t.height);
      const padHeight = Math.max(0.8, (Math.max(...raw) - Math.min(...raw)) * 0.10);
      const min = Math.min(...raw, 1) - padHeight;
      const max = Math.max(...raw, 1) + padHeight;
      const x = date => left + (date - dayStart) / (dayEnd - dayStart) * (width - left - right);
      const y = value => bottom - (value - min) / (max - min) * (bottom - top);
      const curve = samples.map((t, i) => (i ? "L " : "M ") + x(t.date).toFixed(2) + " " + y(t.height).toFixed(2)).join("");
      const oneFootY = y(1);
      const windowStartX = x(dateAtMinute(ymd, 540));
      const windowEndX = x(dateAtMinute(ymd, sunsetMinute));
      const ticks = [0, 6, 12, 18, 24].map(hour => {
        const tx = x(dateAtMinute(ymd, hour * 60));
        return '<text class="forecast-axis" x="' + tx + '" y="315" text-anchor="middle">' + pad(hour) + ':00</text>';
      }).join("");

      function guide(minute, kind, label) {
        const gx = x(dateAtMinute(ymd, minute));
        return '<g class="time-guide ' + kind + '"><line x1="' + gx + '" x2="' + gx + '" y1="' + top + '" y2="321"/>' +
          '<text class="forecast-guide-note" x="' + gx + '" y="338" text-anchor="middle">' + label + '</text></g>';
      }

      function labels(type, laneY) {
        const events = tides.filter(t => t.type === type);
        const labelWidth = 82, gap = 4;
        const centers = events.map(t => clamp(x(t.date), labelWidth / 2 + 4, width - labelWidth / 2 - 4));
        for (let i = 1; i < centers.length; i++) centers[i] = Math.max(centers[i], centers[i - 1] + labelWidth + gap);
        if (centers.length && centers.at(-1) > width - labelWidth / 2 - 4) {
          centers[centers.length - 1] = width - labelWidth / 2 - 4;
          for (let i = centers.length - 2; i >= 0; i--) centers[i] = Math.min(centers[i], centers[i + 1] - labelWidth - gap);
        }
        const low = type === "L", color = low ? "#fbbf24" : "#a8c6dd";
        return events.map((t, i) => {
          const px = x(t.date), py = y(+t.height), cx = centers[i];
          const lineEndY = low ? laneY : laneY + 47;
          return '<g class="forecast-event" data-kind="' + (low ? "low" : "high") + '">' +
            '<path fill="none" d="M ' + px + ' ' + py + ' L ' + cx + ' ' + lineEndY + '"/>' +
            '<circle cx="' + px + '" cy="' + py + '" r="' + (low ? 5 : 4) + '"/>' +
            '<rect x="' + (cx - 41) + '" y="' + laneY + '" width="82" height="47" rx="8"/>' +
            '<text class="forecast-event-kind" x="' + cx + '" y="' + (laneY + 13) + '" text-anchor="middle">' + (low ? "LOW TIDE" : "HIGH TIDE") + '</text>' +
            '<text class="forecast-event-time" x="' + cx + '" y="' + (laneY + 30) + '" text-anchor="middle">' + formatTime(t.date) + '</text>' +
            '<text class="forecast-event-height" x="' + cx + '" y="' + (laneY + 44) + '" text-anchor="middle">' + formatHeight(t.height) + '</text></g>';
        }).join("");
      }

      return '<section class="forecast-chart" id="forecastTideChart" aria-label="Tide curve with daylight guides">' +
        '<svg viewBox="0 0 400 346" role="img" aria-label="Tide curve, 1 foot line, and low-tide search window from 9 AM to sunset">' +
        '<defs><clipPath id="forecastPlotClip"><rect x="' + left + '" y="' + top + '" width="' + (width - left - right) + '" height="' + (bottom - top) + '"/></clipPath></defs>' +
        '<rect class="forecast-window-band" x="' + windowStartX + '" y="' + top + '" width="' + (windowEndX - windowStartX) + '" height="' + (bottom - top) + '"/>' +
        '<line class="forecast-one-foot" x1="' + left + '" x2="' + (width - right) + '" y1="' + oneFootY + '" y2="' + oneFootY + '"/>' +
        '<text class="forecast-one-foot-label" x="' + (left + 4) + '" y="' + (oneFootY - 5) + '">1 ft</text>' +
        guide(540, "window-start", "09:00") + guide(sunsetMinute, "window-end", "SUNSET " + formatMinute(sunsetMinute)) +
        '<path class="forecast-curve" clip-path="url(#forecastPlotClip)" d="' + curve + '"/>' +
        labels("H", 8) + labels("L", 246) + ticks + '</svg></section>';
    }

    function renderFullView(tides, ymd) {
      if (!tides.length) {
        setStatus('No tide predictions available for this date.');
        return;
      }

      const sunsetMinute = sunsetMinutesFor(ymd);
      content.innerHTML = renderForecastChart(tides, ymd, sunsetMinute) + '<p class="forecast-context">Best time to visit the beach</p>';
    }


    async function render() {
      const selected = datePicker.value;
      const isToday = selected === todayYMD();
      weekdayLabel.textContent = formatWeekday(selected);
      todayPill.classList.toggle('hidden', !isToday);

      if (isToday) {
        todayLink.innerHTML = '';
      } else {
        todayLink.innerHTML = '<button id="jumpToday">↺ Back to today</button>';
        document.getElementById('jumpToday').addEventListener('click', () => {
          datePicker.value = todayYMD();
          render();
        });
      }

      setStatus('Loading tide data…');
      try {
        if (isToday) {
          const [contextTides, hourlyHeights] = await Promise.all([
            fetchTides(selected, true),
            fetchHourlyHeights(selected),
          ]);
          const tides = contextTides.filter(t => toYMD(t.date) === selected);
          renderTodayView(tides, contextTides, hourlyHeights);
        } else {
          const tides = await fetchTides(selected);
          renderFullView(tides, selected);
        }
      } catch (e) {
        setStatus('Could not load tide data: ' + e.message, true);
      }
    }

    function shiftDay(delta) {
      const d = parseApiTime(datePicker.value + ' 12:00');
      d.setDate(d.getDate() + delta);
      datePicker.value = toYMD(d);
      render();
    }

    prevBtn.addEventListener('click', () => shiftDay(-1));
    nextBtn.addEventListener('click', () => shiftDay(1));
    datePicker.addEventListener('change', render);

    datePicker.value = todayYMD();
    fetchStationName();
    render();
    setInterval(() => {
      if (datePicker.value === todayYMD()) render();
    }, 60000);

    (function spawnBubbles() {
      const container = document.getElementById('bubbles');
      const count = 18;
      for (let i = 0; i < count; i++) {
        const b = document.createElement('span');
        const size = 4 + Math.random() * 16;
        b.style.width = size + 'px';
        b.style.height = size + 'px';
        b.style.left = Math.random() * 100 + 'vw';
        b.style.animationDuration = (9 + Math.random() * 12) + 's';
        b.style.animationDelay = (-Math.random() * 12) + 's';
        container.appendChild(b);
      }
    })();
  </script>
</body>
</html>
