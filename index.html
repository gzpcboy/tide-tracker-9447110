<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>West Seattle Area Tides</title>
  <meta name="description" content="Live high and low tide times for Lockheed Shipyard, WA (NOAA Station 9447110)." />
  <link rel="canonical" href="https://gzpcboy.github.io/tide-tracker-9447110/" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="West Seattle Area Tides" />
  <meta property="og:title" content="West Seattle Area Tides" />
  <meta property="og:description" content="Live high and low tide times from NOAA Station 9447110." />
  <meta property="og:url" content="https://gzpcboy.github.io/tide-tracker-9447110/" />
  <meta property="og:image" content="https://gzpcboy.github.io/tide-tracker-9447110/social-card.png" />
  <meta property="og:image:alt" content="Moonlit ocean waves for West Seattle Area Tides" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="West Seattle Area Tides" />
  <meta name="twitter:description" content="Live high and low tide times from NOAA Station 9447110." />
  <meta name="twitter:image" content="https://gzpcboy.github.io/tide-tracker-9447110/social-card.png" />
  <style>
    :root {
      --bg-top: #0a2540;
      --bg-bottom: #18608f;
      --accent: #4fd1c5;
      --high: #5eead4;
      --low: #fbbf24;
      --glass: rgba(255, 255, 255, 0.10);
      --glass-border: rgba(255, 255, 255, 0.22);
      --text: #eaf6ff;
      --muted: #a8c6dd;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(60% 45% at 18% 22%, rgba(94, 234, 212, 0.30), transparent 60%),
        radial-gradient(55% 40% at 82% 30%, rgba(45, 212, 191, 0.22), transparent 62%),
        radial-gradient(70% 55% at 30% 80%, rgba(20, 132, 160, 0.45), transparent 65%),
        radial-gradient(65% 50% at 78% 78%, rgba(13, 80, 120, 0.50), transparent 66%),
        radial-gradient(40% 30% at 55% 50%, rgba(125, 240, 220, 0.18), transparent 60%),
        linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bottom) 100%);
      background-attachment: fixed;
      display: flex;
      justify-content: center;
      padding: 14px 12px 24px;
      position: relative;
      overflow-x: hidden;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(8px 8px at 20% 30%, rgba(255,255,255,0.12), transparent 60%),
        radial-gradient(6px 6px at 70% 20%, rgba(255,255,255,0.10), transparent 60%),
        radial-gradient(10px 10px at 40% 70%, rgba(255,255,255,0.10), transparent 60%),
        radial-gradient(7px 7px at 85% 60%, rgba(255,255,255,0.10), transparent 60%),
        repeating-radial-gradient(circle at 30% 40%, rgba(255,255,255,0.05) 0 2px, transparent 2px 26px),
        repeating-radial-gradient(circle at 75% 65%, rgba(255,255,255,0.04) 0 2px, transparent 2px 30px);
      mix-blend-mode: screen;
      opacity: 0.7;
      animation: caustics 16s ease-in-out infinite alternate;
    }
    @keyframes caustics {
      0% { transform: translate3d(0, 0, 0) scale(1); }
      100% { transform: translate3d(-14px, -10px, 0) scale(1.06); }
    }
    .bubbles { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 1; }
    .bubbles span {
      position: absolute;
      bottom: -40px;
      border-radius: 50%;
      background: radial-gradient(circle at 32% 28%, rgba(255,255,255,0.55), rgba(190,245,235,0.12) 60%, transparent 72%);
      box-shadow: 0 0 8px rgba(180, 240, 230, 0.25);
      animation: rise linear infinite;
    }
    @keyframes rise {
      0% { transform: translateY(0) translateX(0); opacity: 0; }
      10% { opacity: 0.8; }
      90% { opacity: 0.7; }
      100% { transform: translateY(-108vh) translateX(20px); opacity: 0; }
    }
    .wave {
      position: fixed; left: 0; right: 0; bottom: 0;
      width: 100%; height: 130px; opacity: 0.35; pointer-events: none;
    }
    .wave path { fill: var(--accent); }
    .app {
      width: 100%;
      max-width: 560px;
      z-index: 2;
    }
    header.title {
      text-align: center;
      margin-bottom: 12px;
    }
    header.title h1 {
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: 0.3px;
      display: flex; align-items: center; justify-content: center; gap: 10px;
    }
    header.title .station {
      margin-top: 6px;
      color: var(--muted);
      font-size: 0.95rem;
      font-weight: 500;
    }
    .date-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      background: var(--glass);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 16px;
      padding: 10px 12px;
      margin-bottom: 10px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.25);
    }
    .nav-btn {
      background: rgba(255,255,255,0.10);
      border: 1px solid var(--glass-border);
      color: var(--text);
      width: 42px; height: 42px;
      border-radius: 12px;
      font-size: 1.2rem;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background .15s, transform .1s;
      flex: 0 0 auto;
    }
    .nav-btn:hover { background: rgba(255,255,255,0.22); }
    .nav-btn:active { transform: scale(0.94); }
    .date-center {
      flex: 1 1 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }
    .date-center input[type="date"] {
      background: rgba(255,255,255,0.08);
      border: 1px solid var(--glass-border);
      color: var(--text);
      padding: 7px 10px;
      border-radius: 10px;
      font-size: 0.95rem;
      color-scheme: dark;
      cursor: pointer;
    }
    .weekday-label {
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.25px;
    }
    .today-pill {
      font-size: 0.72rem;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      color: var(--bg-top);
      background: var(--accent);
      padding: 2px 10px;
      border-radius: 999px;
      font-weight: 700;
    }
    .today-pill.hidden { visibility: hidden; }
    .today-link {
      text-align: center;
      margin-bottom: 18px;
      min-height: 20px;
    }
    .today-link button {
      background: none; border: none; color: var(--accent);
      cursor: pointer; font-size: 0.88rem; text-decoration: underline;
    }
    .cards {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }
    .hero-card {
      margin-bottom: 14px;
      padding: 22px 20px;
    }
    .hero-card::after {
      content: "";
      position: absolute;
      inset: auto -10% -35% 35%;
      height: 140px;
      background: radial-gradient(circle, rgba(79, 209, 197, 0.28), transparent 65%);
      pointer-events: none;
    }
    .hero-card .eyebrow {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.9px;
      color: var(--muted);
      margin-bottom: 10px;
    }
    .hero-card .current-line {
      display: flex;
      align-items: baseline;
      gap: 10px;
      flex-wrap: wrap;
    }
    .hero-card .current-height {
      font-size: 1rem;
      line-height: 1.2;
      font-weight: 700;
    }
    .hero-card .trend {
      font-size: 0.98rem;
      color: var(--accent);
      font-weight: 700;
    }
    .hero-card .summary {
      margin-top: 12px;
      color: var(--text);
      font-size: 1rem;
    }
    .hero-card .meta {
      margin-top: 8px;
      color: var(--muted);
      font-size: 0.88rem;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }
    .hero-card .progress {
      margin-top: 14px;
      height: 10px;
      border-radius: 999px;
      background: rgba(255,255,255,0.12);
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.08);
    }
    .hero-card .progress > span {
      display: block;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, rgba(79, 209, 197, 0.45), rgba(94, 234, 212, 0.95));
      box-shadow: 0 0 20px rgba(94, 234, 212, 0.35);
    }
    .card {
      background: var(--glass);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 18px;
      padding: 20px 18px;
      box-shadow: 0 10px 34px rgba(0, 0, 0, 0.28);
      position: relative;
      overflow: hidden;
    }
    .card .label {
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--muted);
      display: flex; align-items: center; gap: 7px;
      margin-bottom: 10px;
    }
    .card .dot { width: 10px; height: 10px; border-radius: 50%; }
    .card.high .dot { background: var(--high); box-shadow: 0 0 10px var(--high); }
    .card.low .dot { background: var(--low); box-shadow: 0 0 10px var(--low); }
    .card.low {
      border-color: rgba(251, 191, 36, 0.52);
      background: linear-gradient(135deg, rgba(251,191,36,0.18), var(--glass));
    }
    .card.low .height { color: #ffe19a; font-weight: 800; }
    .card .time {
      font-size: 1.9rem;
      font-weight: 700;
      line-height: 1.1;
    }
    .card .ampm { font-size: 1rem; font-weight: 600; color: var(--muted); margin-left: 4px; }
    .card .height { margin-top: 8px; color: var(--muted); font-size: 0.9rem; }
    .card .rel { margin-top: 4px; font-size: 0.8rem; color: var(--accent); }
    .card .none { font-size: 1.9rem; font-weight: 700; color: var(--muted); }

    .tide-chart {
      margin: 0 0 10px;
      background: var(--glass);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 18px;
      padding: 15px 12px 10px;
      box-shadow: 0 10px 34px rgba(0, 0, 0, 0.28);
    }
    .tide-chart h2 {
      padding: 0 6px 10px;
      color: var(--muted);
      font-size: 0.82rem;
      font-weight: 600;
      letter-spacing: 0.8px;
      text-transform: uppercase;
    }
    .tide-chart svg { display: block; width: 100%; height: auto; overflow: hidden; }
    .tide-chart .grid-line { stroke: rgba(255,255,255,0.13); stroke-width: 1; }
    .tide-chart .curve { fill: none; stroke: var(--accent); stroke-width: 4; stroke-linecap: round; }
    .tide-chart .axis-label { fill: var(--muted); font-size: 11px; font-weight: 600; }
    .tide-chart .now-line { stroke: #fff; stroke-width: 1.5; stroke-dasharray: 4 4; opacity: 0.8; }
    .tide-chart .now-dot { fill: #fff; stroke: var(--accent); stroke-width: 4; }
    .tide-chart .now-label { fill: #fff; font-size: 11px; font-weight: 700; }
    .tide-chart .turn-stem { stroke-width: 1.5; stroke-dasharray: 3 3; opacity: 0.8; }
    .tide-chart .turn-high { fill: var(--accent); stroke: var(--accent); }
    .tide-chart .turn-low { fill: var(--low); stroke: var(--low); }
    .tide-chart .turn-title { font-size: 11px; font-weight: 700; }
    .tide-chart .turn-detail { font-size: 11px; font-weight: 600; }
    .tide-chart .turn-value { font-size: 13px; font-weight: 800; }

    .trend-strip {
      display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap;
      margin-bottom: 10px; padding: 10px 14px;
      background: var(--glass); border: 1px solid var(--glass-border);
      border-radius: 14px; color: var(--muted); font-size: 0.82rem;
    }
    .trend-strip .trend-status { color: var(--accent); font-weight: 800; }
    .trend-strip .trend-next { color: var(--text); font-weight: 650; }

    .low-outlook {
      background: var(--glass); border: 1px solid rgba(251, 191, 36, 0.5);
      border-radius: 18px; padding: 14px; box-shadow: 0 10px 34px rgba(0, 0, 0, 0.28);
    }
    .low-outlook h2 {
      color: #ffe19a; font-size: 0.84rem; text-transform: uppercase;
      letter-spacing: 0.8px; font-weight: 800; margin-bottom: 10px;
    }
    .low-events { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
    .low-event {
      background: rgba(251,191,36,0.12); border: 1px solid rgba(251,191,36,0.28);
      border-radius: 12px; padding: 11px 12px;
    }
    .low-event .low-time { color: var(--text); font-size: 1.12rem; font-weight: 800; }
    .low-event .low-height { color: #ffe19a; font-size: 1rem; font-weight: 800; margin-top: 2px; }
    .low-event .low-label { color: var(--muted); font-size: 0.74rem; text-transform: uppercase; letter-spacing: 0.55px; margin-bottom: 5px; }

    .full-list {
      margin-top: 10px;
      background: var(--glass);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 18px;
      padding: 8px 6px;
      box-shadow: 0 10px 34px rgba(0, 0, 0, 0.28);
    }
    .full-list h2 {
      font-size: 0.82rem; text-transform: uppercase; letter-spacing: 0.8px;
      color: var(--muted); padding: 10px 14px 8px; font-weight: 600;
    }
    .today-reference { margin-top: 10px; }
    .today-reference summary {
      cursor: pointer; list-style: none; padding: 10px 14px;
      color: var(--muted); font-size: 0.82rem; font-weight: 600;
      text-transform: uppercase; letter-spacing: 0.8px;
    }
    .today-reference summary::-webkit-details-marker { display: none; }
    .today-reference summary::after { content: '⌄'; float: right; color: var(--accent); }
    .today-reference[open] summary::after { content: '⌃'; }
    .tide-row {
      display: flex; align-items: center; gap: 14px;
      padding: 12px 14px;
      border-radius: 12px;
    }
    .tide-row + .tide-row { border-top: 1px solid rgba(255,255,255,0.08); }
    .tide-row .badge {
      font-size: 0.72rem; font-weight: 700; text-transform: uppercase;
      padding: 4px 10px; border-radius: 999px; letter-spacing: 0.5px;
      flex: 0 0 auto; width: 56px; text-align: center;
    }
    .tide-row .badge.high { background: rgba(94,234,212,0.18); color: var(--high); }
    .tide-row .badge.low { background: rgba(251,191,36,0.18); color: var(--low); }
    .tide-row .r-time { font-size: 1.15rem; font-weight: 700; flex: 1 1 auto; }
    .tide-row .r-height { color: var(--muted); font-size: 0.92rem; }
    .tide-row .r-status { color: var(--muted); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.45px; }
    .tide-row.past { opacity: 0.56; }

    .status { text-align: center; color: var(--muted); padding: 30px 0; font-size: 0.95rem; }
    .status.error { color: #ff9b9b; }

    footer.station-footer {
      margin-top: 14px;
      text-align: center;
    }
    footer.station-footer a {
      color: var(--accent);
      text-decoration: none;
      font-size: 0.9rem;
      border: 1px solid var(--glass-border);
      padding: 9px 16px;
      border-radius: 999px;
      background: var(--glass);
      display: inline-flex; align-items: center; gap: 8px;
      transition: background .15s;
    }
    footer.station-footer a:hover { background: rgba(255,255,255,0.16); }
    .hidden { display: none !important; }
    @media (max-width: 420px) {
      .cards { grid-template-columns: 1fr; }
      .hero-card .current-height { font-size: 2.1rem; }
      .card .time { font-size: 1.55rem; }
    }
  </style>
</head>
<body>
  <div class="bubbles" id="bubbles" aria-hidden="true"></div>
  <svg class="wave" viewBox="0 0 1440 130" preserveAspectRatio="none" aria-hidden="true">
    <path d="M0,64 C240,120 480,8 720,40 C960,72 1200,128 1440,72 L1440,130 L0,130 Z"></path>
  </svg>

  <main class="app">
    <header class="title">
      <h1><span aria-hidden="true">🌊</span> West Seattle Area Tides</h1>
      <div class="station" id="stationName">Station 9447110</div>
    </header>

    <div class="date-bar">
      <button class="nav-btn" id="prevDay" title="Previous day" aria-label="Previous day">‹</button>
      <div class="date-center">
        <input type="date" id="datePicker" aria-label="Select date" />
        <span class="weekday-label" id="weekdayLabel" aria-live="polite"></span>
        <span class="today-pill" id="todayPill">Today</span>
      </div>
      <button class="nav-btn" id="nextDay" title="Next day" aria-label="Next day">›</button>
    </div>

    <div class="today-link" id="todayLink"></div>

    <div id="content"></div>

    <footer class="station-footer">
      <a id="stationHomeLink"
         href="https://tidesandcurrents.noaa.gov/stationhome.html?id=9447110#info"
         target="_blank" rel="noopener">
        📍 View station home on NOAA Tides &amp; Currents
      </a>
    </footer>
  </main>

  <script>
    const STATION_ID = "9447110";
    const API_BASE = "https://api.tidesandcurrents.noaa.gov/api/prod/datagetter";
    const MD_API = "https://api.tidesandcurrents.noaa.gov/mdapi/prod/webapi/stations/" + STATION_ID + ".json";

    const datePicker = document.getElementById("datePicker");
    const prevBtn = document.getElementById("prevDay");
    const nextBtn = document.getElementById("nextDay");
    const todayPill = document.getElementById("todayPill");
    const weekdayLabel = document.getElementById("weekdayLabel");
    const todayLink = document.getElementById("todayLink");
    const content = document.getElementById("content");
    const stationNameEl = document.getElementById("stationName");

    function pad(n) { return String(n).padStart(2, "0"); }
    function toYMD(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
    function ymdCompact(s) { return s.replace(/-/g, ""); }
    function todayYMD() { return toYMD(new Date()); }

    function parseApiTime(t) {
      const [datePart, timePart] = t.split(" ");
      const [y, mo, d] = datePart.split("-").map(Number);
      const [h, mi] = timePart.split(":").map(Number);
      return new Date(y, mo - 1, d, h, mi);
    }

    function formatTime(date) {
      return pad(date.getHours()) + ":" + pad(date.getMinutes());
    }

    function formatHeight(v) {
      const n = parseFloat(v);
      return n.toFixed(1) + " ft";
    }

    function formatWeekday(ymd) {
      const d = parseApiTime(ymd + " 12:00");
      return d.toLocaleDateString(undefined, { weekday: "long" });
    }

    function formatLongDate(ymd) {
      const d = parseApiTime(ymd + " 12:00");
      return d.toLocaleDateString(undefined, {
        weekday: "long", month: "long", day: "numeric", year: "numeric",
      });
    }

    function formatAsOf(date) {
      return formatTime(date);
    }

    function relativeFromNow(date) {
      const diffMs = date - new Date();
      const mins = Math.round(diffMs / 60000);
      if (mins <= 0) return "now";
      const h = Math.floor(mins / 60);
      const m = mins % 60;
      if (h === 0) return "in " + m + " min";
      if (m === 0) return "in " + h + " hr";
      return "in " + h + " hr " + m + " min";
    }

    function clamp(value, min, max) {
      return Math.min(max, Math.max(min, value));
    }

    function estimateCurrentTide(tides, now) {
      let prev = null;
      let next = null;

      for (const tide of tides) {
        if (tide.date <= now) prev = tide;
        if (!next && tide.date > now) next = tide;
      }

      if (!prev || !next) return null;

      const totalMs = next.date - prev.date;
      if (totalMs <= 0) return null;

      const progress = clamp((now - prev.date) / totalMs, 0, 1);
      const start = parseFloat(prev.height);
      const end = parseFloat(next.height);
      const swing = (1 - Math.cos(Math.PI * progress)) / 2;
      const height = start + (end - start) * swing;
      const trend = end > start ? "Rising" : "Falling";
      const nextLabel = next.type === "H" ? "high" : "low";

      return {
        prev,
        next,
        trend,
        height,
        progress,
        summary: trend + " toward " + nextLabel + " tide",
      };
    }

    function setStatus(msg, isError) {
      content.innerHTML = '<div class="status' + (isError ? ' error' : '') +
        '" id="statusMsg">' + msg + "</div>";
    }

    async function fetchStationName() {
      try {
        const res = await fetch(MD_API);
        if (!res.ok) return;
        const data = await res.json();
        const s = data.stations && data.stations[0];
        if (s && s.name) {
          stationNameEl.textContent = s.name +
            (s.state ? ', ' + s.state : '') + ' · Station ' + STATION_ID;
        }
      } catch (e) { }
    }

    async function fetchTides(ymd) {
      const selectedDay = parseApiTime(ymd + ' 12:00');
      const previousDay = new Date(selectedDay);
      const nextDay = new Date(selectedDay);
      previousDay.setDate(previousDay.getDate() - 1);
      nextDay.setDate(nextDay.getDate() + 1);
      const url = API_BASE +
        '?product=predictions&application=tide-tracker&datum=MLLW&station=' + STATION_ID +
        '&time_zone=lst_ldt&units=english&interval=hilo&format=json' +
        '&begin_date=' + ymdCompact(toYMD(previousDay)) + '&end_date=' + ymdCompact(toYMD(nextDay));
      const res = await fetch(url);
      if (!res.ok) throw new Error('NOAA API returned ' + res.status);
      const data = await res.json();
      if (data.error) throw new Error(data.error.message || 'API error');
      return (data.predictions || []).map(p => ({
        date: parseApiTime(p.t),
        height: p.v,
        type: p.type,
      }));
    }

    function renderTodayView(tides, contextTides, hourlyHeights) {
      const now = new Date();
      const nextHigh = tides.find(t => t.type === 'H' && t.date > now);
      const nextLow = tides.find(t => t.type === 'L' && t.date > now);
      const current = estimateCurrentTide(contextTides, now);

      function cardHtml(kind, label, tide) {
        if (!tide) {
          return '<div class="card ' + kind + '" data-kind="' + kind + '" data-state="none">' +
            '<div class="label"><span class="dot"></span>' + label + '</div>' +
            '<div class="none">–</div>' +
            '<div class="height">No more ' + kind + ' tide today</div></div>';
        }
        const f = formatTime(tide.date);
        return '<div class="card ' + kind + '" data-kind="' + kind + '" data-state="value">' +
          '<div class="label"><span class="dot"></span>' + label + '</div>' +
          '<div class="time">' + f + '</div>' +
          '<div class="height">' + formatHeight(tide.height) + '</div>' +
          '<div class="rel">' + relativeFromNow(tide.date) + '</div></div>';
      }

      const currentHtml = current
        ? '<section class="card hero-card" id="currentTideCard" data-state="value">' +
          '<div class="eyebrow">Current tide</div>' +
          '<div class="current-line">' +
            '<div class="trend">' + current.trend + '</div>' +
          '</div>' +
          '<div class="summary">' + current.summary + '</div>' +
          '<div class="meta">' +
            '<span>As of ' + formatAsOf(now) + '</span>' +
            '<span>Next turn ' + relativeFromNow(current.next.date) + '</span>' +
          '</div>' +
          '<div class="progress" aria-hidden="true"><span style="width:' + Math.round(current.progress * 100) + '%"></span></div>' +
        '</section>'
        : '<section class="card hero-card" id="currentTideCard" data-state="none">' +
          '<div class="eyebrow">Current tide</div>' +
          '<div class="current-line"><div class="current-height">No current estimate</div></div>' +
          '<div class="summary">Current tide estimate becomes available once we have both the previous and next tide turn.</div>' +
          '<div class="meta"><span>As of ' + formatAsOf(now) + '</span></div>' +
        '</section>';

      let referenceRows = '';
      for (const t of tides) {
        const f = formatTime(t.date);
        const kind = t.type === 'H' ? 'high' : 'low';
        const word = t.type === 'H' ? 'High' : 'Low';
        const isPast = t.date <= now;
        referenceRows += '<div class="tide-row' + (isPast ? ' past' : '') + '" data-kind="' + kind + '">' +
          '<span class="badge ' + kind + '">' + word + '</span>' +
          '<span class="r-time">' + f + '</span>' +
          '<span class="r-height">' + formatHeight(t.height) + '</span>' +
          (isPast ? '<span class="r-status">Passed</span>' : '') +
        '</div>';
      }

      const nextTurns = tides.filter(t => t.date > now).slice(0, 2).map(t => {
        const label = t.type === 'H' ? 'high' : 'low';
        return '<span class="trend-next">Next ' + label + ' ' + formatTime(t.date) + ' · ' + formatHeight(t.height) + '</span>';
      }).join('<span>→</span>');
      const trendHtml = current
        ? '<section class="trend-strip"><span class="trend-status">' + current.trend + '</span>' + nextTurns + '</section>'
        : '';

      content.innerHTML = trendHtml + renderTideChart(tides, now, current, contextTides, hourlyHeights) + '<div class="cards">' +
        cardHtml('low', 'Next Low Tide', nextLow) +
        cardHtml('high', 'Next High Tide', nextHigh) +
        '</div>' +
        '<details class="full-list today-reference" aria-label="Today’s tide reference"><summary>Today’s tide reference</summary>' +
        referenceRows + '</details>';
    }

    function renderTideChart(tides, now, current, contextTides, hourlyHeights) {
      if (tides.length < 2) return '';

      const width = 520, height = 190, left = 32, right = 14, top = 18, bottom = 28;
      const plotWidth = width - left - right, plotHeight = height - top - bottom;
      const selectedYmd = toYMD(tides[0].date);
      const dayStart = parseApiTime(selectedYmd + ' 00:00');
      const dayEnd = new Date(dayStart);
      dayEnd.setDate(dayEnd.getDate() + 1);
      const curveStart = new Date(dayStart);
      const curveEnd = new Date(dayEnd);
      curveStart.setHours(curveStart.getHours() - 1);
      curveEnd.setHours(curveEnd.getHours() + 1);
      const curveTides = [...hourlyHeights, ...contextTides]
        .filter(t => t.date >= curveStart && t.date <= curveEnd)
        .sort((a, b) => a.date - b.date);
      const heights = curveTides.map(t => parseFloat(t.height));
      const min = Math.min(...heights), max = Math.max(...heights);
      const padding = Math.max(1, (max - min) * 0.16);
      const x = date => left + ((date - dayStart) / (dayEnd - dayStart)) * plotWidth;
      const y = value => top + ((max + padding - value) / (max - min + padding * 2)) * plotHeight;

      let path = 'M ' + x(curveTides[0].date).toFixed(1) + ' ' + y(parseFloat(curveTides[0].height)).toFixed(1);
      for (let i = 1; i < curveTides.length; i++) {
        const tide = curveTides[i];
        path += ' L ' + x(tide.date).toFixed(1) + ' ' + y(parseFloat(tide.height)).toFixed(1);
      }

      const tickHours = [0, 6, 12, 18, 24];
      const ticks = tickHours.map(hour => {
        const tickX = left + (hour / 24) * plotWidth;
        const label = pad(hour % 24) + ':00';
        return '<line class="grid-line" x1="' + tickX + '" y1="' + top + '" x2="' + tickX + '" y2="' + (top + plotHeight) + '"></line>' +
          '<text class="axis-label" x="' + tickX + '" y="' + (height - 7) + '" text-anchor="middle">' + label + '</text>';
      }).join('');

      const nowX = x(now);
      const marker = current
        ? '<g class="now-marker"><line class="now-line" x1="' + nowX.toFixed(1) + '" y1="' + top + '" x2="' + nowX.toFixed(1) + '" y2="' + (top + plotHeight) + '"></line>' +
          '<circle class="now-dot" cx="' + nowX.toFixed(1) + '" cy="' + y(current.height).toFixed(1) + '" r="6"></circle>' +
          '<text class="now-label" x="' + nowX.toFixed(1) + '" y="' + Math.max(12, y(current.height) - 30).toFixed(1) + '" text-anchor="middle">Now</text>' +
          '<text class="now-label" x="' + nowX.toFixed(1) + '" y="' + Math.max(24, y(current.height) - 17).toFixed(1) + '" text-anchor="middle">' + formatTime(now) + '</text>' +
          '<text class="now-label" x="' + nowX.toFixed(1) + '" y="' + Math.max(36, y(current.height) - 4).toFixed(1) + '" text-anchor="middle">' + current.height.toFixed(1) + ' ft</text></g>'
        : '';

      const nextHigh = tides.find(t => t.type === 'H' && t.date > now);
      const nextLow = tides.find(t => t.type === 'L' && t.date > now);
      function turnLabel(tide, title, kind) {
        if (!tide) return '';
        const tx = x(tide.date), ty = y(parseFloat(tide.height));
        const isHigh = kind === 'high';
        const stemEnd = isHigh ? Math.min(top + plotHeight - 45, ty + 22) : Math.max(top + 36, ty - 22);
        const labelY = isHigh ? stemEnd + 12 : stemEnd - 24;
        return '<g class="turn-label turn-' + kind + '"><line class="turn-stem" x1="' + tx.toFixed(1) + '" y1="' + ty.toFixed(1) + '" x2="' + tx.toFixed(1) + '" y2="' + stemEnd.toFixed(1) + '"></line>' +
          '<circle cx="' + tx.toFixed(1) + '" cy="' + ty.toFixed(1) + '" r="5"></circle>' +
          '<text x="' + tx.toFixed(1) + '" y="' + labelY.toFixed(1) + '" text-anchor="middle"><tspan class="turn-title" x="' + tx.toFixed(1) + '">' + title + '</tspan>' +
          '<tspan class="turn-detail" x="' + tx.toFixed(1) + '" dy="13">' + formatTime(tide.date) + '</tspan>' +
          '<tspan class="turn-value" x="' + tx.toFixed(1) + '" dy="14">' + formatHeight(tide.height) + '</tspan></text></g>';
      }
      const turns = turnLabel(nextHigh, 'High tide', 'high') + turnLabel(nextLow, 'Low tide', 'low');

      return '<section class="tide-chart" id="todayTideChart" aria-label="Today’s tide curve">' +
        '<h2>Today’s tide curve</h2><svg viewBox="0 0 ' + width + ' ' + height + '" role="img" aria-label="Tide height over 24 hours">' +
        ticks + '<path class="curve" d="' + path + '"></path>' + turns + marker + '</svg></section>';
    }

    function estimateHeightAt(tides, at) {
      let previous = null;
      let next = null;
      for (const tide of tides) {
        if (tide.date <= at) previous = tide;
        if (!next && tide.date > at) next = tide;
      }
      if (!previous || !next) return null;
      const progress = clamp((at - previous.date) / (next.date - previous.date), 0, 1);
      const start = parseFloat(previous.height);
      const end = parseFloat(next.height);
      return start + (end - start) * ((1 - Math.cos(Math.PI * progress)) / 2);
    }

    function buildHourlyCurvePoints(tides, ymd) {
      const start = parseApiTime(ymd + ' 00:00');
      const points = [];
      for (let hour = -1; hour <= 25; hour++) {
        const date = new Date(start);
        date.setHours(date.getHours() + hour);
        const height = estimateHeightAt(tides, date);
        if (height !== null) points.push({ date, height: String(height) });
      }
      return points;
    }

    function renderFullView(tides, ymd) {
      if (!tides.length) {
        setStatus('No tide predictions available for this date.');
        return;
      }

      const lowTides = tides.filter(t => t.type === 'L');
      const lowEvents = lowTides.map(t => {
        return '<article class="low-event">' +
          '<div class="low-label">Low tide</div>' +
          '<div class="low-time">' + formatTime(t.date) + '</div>' +
          '<div class="low-height">' + formatHeight(t.height) + '</div></article>';
      }).join('');

      const otherRows = tides.filter(t => t.type === 'H').map(t => {
        return '<div class="tide-row" data-kind="high">' +
          '<span class="badge high">High</span>' +
          '<span class="r-time">' + formatTime(t.date) + '</span>' +
          '<span class="r-height">' + formatHeight(t.height) + '</span></div>';
      }).join('');

      content.innerHTML = '<section class="low-outlook" aria-label="Low tides for selected date"><h2>Low tides · ' +
        formatLongDate(ymd) + '</h2><div class="low-events">' + lowEvents + '</div></section>' +
        '<details class="full-list"><summary>High-tide reference</summary>' + otherRows + '</details>';
    }

    async function render() {
      const selected = datePicker.value;
      const isToday = selected === todayYMD();
      weekdayLabel.textContent = formatWeekday(selected);
      todayPill.classList.toggle('hidden', !isToday);

      if (isToday) {
        todayLink.innerHTML = '';
      } else {
        todayLink.innerHTML = '<button id="jumpToday">↺ Back to today</button>';
        document.getElementById('jumpToday').addEventListener('click', () => {
          datePicker.value = todayYMD();
          render();
        });
      }

      setStatus('Loading tide data…');
      try {
        const contextTides = await fetchTides(selected);
        const tides = contextTides.filter(t => toYMD(t.date) === selected);
        const hourlyHeights = buildHourlyCurvePoints(contextTides, selected);
        if (isToday) renderTodayView(tides, contextTides, hourlyHeights);
        else renderFullView(tides, selected);
      } catch (e) {
        setStatus('Could not load tide data: ' + e.message, true);
      }
    }

    function shiftDay(delta) {
      const d = parseApiTime(datePicker.value + ' 12:00');
      d.setDate(d.getDate() + delta);
      datePicker.value = toYMD(d);
      render();
    }

    prevBtn.addEventListener('click', () => shiftDay(-1));
    nextBtn.addEventListener('click', () => shiftDay(1));
    datePicker.addEventListener('change', render);

    datePicker.value = todayYMD();
    fetchStationName();
    render();
    setInterval(() => {
      if (datePicker.value === todayYMD()) render();
    }, 60000);

    (function spawnBubbles() {
      const container = document.getElementById('bubbles');
      const count = 18;
      for (let i = 0; i < count; i++) {
        const b = document.createElement('span');
        const size = 4 + Math.random() * 16;
        b.style.width = size + 'px';
        b.style.height = size + 'px';
        b.style.left = Math.random() * 100 + 'vw';
        b.style.animationDuration = (9 + Math.random() * 12) + 's';
        b.style.animationDelay = (-Math.random() * 12) + 's';
        container.appendChild(b);
      }
    })();
  </script>
</body>
</html>
